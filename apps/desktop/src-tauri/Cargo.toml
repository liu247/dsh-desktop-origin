[package]
name = "dsh-desktop"
version = "0.1.0-rc.8"
description = "DeepSeek Harness desktop shell"
edition = "2021"

# The shell hosts the dsh web service and renders its GUI; see apps/desktop/README.md.
[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol marks a packaged (non-dev) build: tauri::is_dev() is
# !custom-protocol, and the shell picks the bundled runtime only when it is
# set. Without it the release app would spawn the checkout's source CLI.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
